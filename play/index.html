<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The game moved back to the site root; /play/ only exists so links minted
         while it lived here keep working — invite URLs (?join=CODE), Stripe
         returns (?purchase=success), bookmarks. Production redirects these with
         a real 301 in nginx (see tools/deploy.mjs); this page is the fallback
         for dev and for /play/index.html itself, and it carries the query
         string and hash across, which a bare meta-refresh cannot. -->
    <title>SneakBit</title>
    <link rel="canonical" href="https://sneakbit.curzel.it/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/" />
    <script>location.replace("/" + location.search + location.hash);</script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { background: #000; color: #ccc; font-family: monospace; margin: 48px; }
      a { color: #ffb703; }
    </style>
  </head>
  <body>
    <p>SneakBit now plays at <a href="/">sneakbit.curzel.it</a>.</p>
  </body>
</html>
